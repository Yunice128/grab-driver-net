
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Monthly Summary - Grab Driver Net</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;color:#111827;
}
.container{max-width:650px;margin:auto}
.header{
  background:#111827;color:white;
  padding:20px;border-radius:16px;
  margin-bottom:16px;
}
.header h2{margin:0 0 6px}
.header p{margin:0;color:#cbd5e1;font-size:13px}
.back{
  display:inline-block;margin-top:14px;
  color:#93c5fd;text-decoration:none;
}
.panel{
  background:white;padding:16px;
  border-radius:14px;margin-bottom:14px;
}
label{font-size:13px;color:#64748b}
select{
  width:100%;padding:12px;margin-top:8px;
  border:1px solid #cbd5e1;border-radius:9px;
  font-size:16px;background:white;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.metric{
  background:#f8fafc;padding:14px;
  border-radius:11px;border:1px solid #e2e8f0;
}
.metric .name{font-size:12px;color:#64748b}
.metric .value{
  font-size:20px;font-weight:bold;
  margin-top:7px;overflow-wrap:anywhere;
}
.net{color:#047857}
h3{font-size:16px;margin:0 0 14px}
.bar-row{margin:13px 0}
.bar-label{
  display:flex;justify-content:space-between;
  gap:8px;font-size:13px;margin-bottom:6px;
}
.bar-bg{
  height:11px;background:#e2e8f0;
  border-radius:20px;overflow:hidden;
}
.bar{
  height:100%;background:#0f766e;
  border-radius:20px;min-width:0;
}
.month-row{
  padding:12px 0;border-bottom:1px solid #e2e8f0;
  display:flex;justify-content:space-between;
  gap:10px;font-size:14px;
}
.month-row:last-child{border-bottom:0}
.month-name{font-weight:bold}
.month-net{font-weight:bold;color:#047857}
.empty{
  text-align:center;color:#64748b;
  padding:25px 10px;font-size:14px;
}
.note{font-size:12px;color:#64748b;line-height:1.5}
button{
  border:0;border-radius:9px;padding:11px 15px;
  background:#111827;color:white;font-size:14px;
}
@media(max-width:360px){
  .metric .value{font-size:17px}
}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h2>Monthly Summary</h2>
  <p>Grab Driver Net · 每月收入总结</p>
  <a class="back" href="./index32.html">← 返回主页面</a>
</div>

<div class="panel">
  <label for="monthSelect">选择月份 / Select Month</label>
  <select id="monthSelect"></select>
</div>

<div id="summary">
  <div class="empty">正在读取记录……</div>
</div>

<div class="panel">
  <h3>Monthly Net Income Comparison</h3>
  <div id="comparison"></div>
</div>

<div class="panel">
  <h3>所有月份记录</h3>
  <div id="monthList"></div>
</div>

<p class="note">
  数据来自本机浏览器现有 Grab Driver Net 记录。
  本页面只读取数据，不会修改或删除记录。
  建议定期在主 App 的「数据」页面下载备份。
</p>

</div>

<script>
const STORAGE_KEY = "grab_driver_net_2_records";

function readRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  }catch(e){
    return [];
  }
}

function number(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function firstValue(obj, keys){
  for(const key of keys){
    if(obj[key] !== undefined && obj[key] !== null && obj[key] !== ""){
      return obj[key];
    }
  }
  return 0;
}

function getDate(r){
  return String(firstValue(r,["date","workDate","day"])).slice(0,10);
}

function getTimeHours(r){
  const direct = firstValue(r,["hours","workHours","totalHours"]);
  if(direct !== 0 && direct !== ""){
    return number(direct);
  }

  const start = firstValue(r,["startTime","start","timeStart"]);
  const end = firstValue(r,["endTime","end","timeEnd"]);

  if(!start || !end) return 0;

  const parse = t => {
    const parts = String(t).split(":");
    if(parts.length < 2) return NaN;
    return Number(parts[0])*60 + Number(parts[1]);
  };

  let a = parse(start);
  let b = parse(end);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  if(b < a) b += 1440;
  return (b-a)/60;
}

function getMonthData(records){
  const months = {};

  records.forEach(r=>{
    const date = getDate(r);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;

    const month = date.slice(0,7);
    if(!months[month]){
      months[month]={
        month,
        gross:0,
        expenses:0,
        net:0,
        hours:0,
        km:0,
        days:new Set(),
        count:0
      };
    }

    const m=months[month];

    const income=number(firstValue(r,["income","earnings","gross","totalIncome"]));
    const bonus=number(firstValue(r,["bonus","incentive","tips"]));

    const petrol=number(firstValue(r,["petrol","fuel"]));
    const toll=number(firstValue(r,["toll"]));
    const parking=number(firstValue(r,["parking"]));
    const repair=number(firstValue(r,["repair","maintenance"]));
    const other=number(firstValue(r,["other","others","expense"]));

    const expense=petrol+toll+parking+repair+other;
    const gross=income+bonus;

    m.gross+=gross;
    m.expenses+=expense;
    m.net+=gross-expense;
    m.hours+=getTimeHours(r);
    m.km+=number(firstValue(r,["km","distance","totalKm"]));
    m.days.add(date);
    m.count++;
  });

  return Object.values(months).sort((a,b)=>b.month.localeCompare(a.month));
}

function money(v){
  return "RM "+v.toLocaleString("en-MY",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function monthLabel(s){
  const [y,m]=s.split("-");
  const names=["Jan","Feb","Mar","Apr","May","Jun",
    "Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[Number(m)-1]+" "+y;
}

const records=readRecords();
const months=getMonthData(records);
const select=document.getElementById("monthSelect");
const summary=document.getElementById("summary");
const comparison=document.getElementById("comparison");
const monthList=document.getElementById("monthList");

function renderSummary(m){
  if(!m){
    summary.innerHTML='<div class="panel empty">这个月份没有记录。</div>';
    return;
  }

  const days=m.days.size;
  const avg=m.hours>0?m.net/m.hours:0;

  summary.innerHTML=`
    <div class="panel">
      <h3>${monthLabel(m.month)} 收入总结</h3>
      <div class="grid">
        <div class="metric">
          <div class="name">Gross Income · 总收入</div>
          <div class="value">${money(m.gross)}</div>
        </div>
        <div class="metric">
          <div class="name">Expenses · 总开销</div>
          <div class="value">${money(m.expenses)}</div>
        </div>
        <div class="metric">
          <div class="name">Net Income · 净收入</div>
          <div class="value net">${money(m.net)}</div>
        </div>
        <div class="metric">
          <div class="name">Working Days · 工作天数</div>
          <div class="value">${days}</div>
        </div>
        <div class="metric">
          <div class="name">Working Hours · 工作小时</div>
          <div class="value">${m.hours.toFixed(1)} h</div>
        </div>
        <div class="metric">
          <div class="name">Net per Hour · 每小时净收入</div>
          <div class="value">${money(avg)}</div>
        </div>
        <div class="metric">
          <div class="name">Total Distance · 总公里</div>
          <div class="value">${m.km.toFixed(1)} km</div>
        </div>
        <div class="metric">
          <div class="name">Records · 记录数量</div>
          <div class="value">${m.count}</div>
        </div>
      </div>
    </div>`;
}

function renderComparison(){
  if(!months.length){
    comparison.innerHTML='<div class="empty">暂无收入记录</div>';
    monthList.innerHTML='<div class="empty">暂无记录</div>';
    return;
  }

  const max=Math.max(...months.map(m=>Math.max(m.net,0)),1);

  comparison.innerHTML=months.map(m=>{
    const width=Math.max(0,m.net)/max*100;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span>${monthLabel(m.month)}</span>
          <strong>${money(m.net)}</strong>
        </div>
        <div class="bar-bg">
          <div class="bar" style="width:${width}%"></div>
        </div>
      </div>`;
  }).join("");

  monthList.innerHTML=months.map(m=>`
    <div class="month-row">
      <span class="month-name">${monthLabel(m.month)}</span>
      <span class="month-net">${money(m.net)}</span>
    </div>
  `).join("");
}

if(!months.length){
  select.innerHTML='<option value="">没有找到记录</option>';
  summary.innerHTML=`
    <div class="panel empty">
      没有读取到记录。<br><br>
      请先在主 App 保存收入记录，<br>
      并确认使用同一个浏览器。
    </div>`;
}else{
  select.innerHTML=months.map(m=>
    `<option value="${m.month}">${monthLabel(m.month)}</option>`
  ).join("");

  select.addEventListener("change",()=>{
    renderSummary(months.find(m=>m.month===select.value));
  });

  renderSummary(months[0]);
}

renderComparison();
</script>
</body>
</html>
